<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="128" height="128" rx="28" fill="#060609" />
  
  <!-- Inner Background with Subtle Tint -->
  <rect x="5" y="5" width="118" height="118" rx="23" fill="#0d0d16" />

  <!-- Gradient Glowing Border -->
  <rect x="4" y="4" width="120" height="120" rx="24" fill="none" stroke="url(#glowGrad)" stroke-width="4" filter="url(#glow)" />
  <rect x="4" y="4" width="120" height="120" rx="24" fill="none" stroke="url(#glowGrad)" stroke-width="3" />

  <!-- MSS Typography -->
  <text x="64" y="78" 
        text-anchor="middle" 
        font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-size="44" 
        font-weight="900" 
        letter-spacing="2"
        fill="url(#textGrad)">MSS</text>
</svg>
