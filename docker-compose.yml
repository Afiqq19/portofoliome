version: '3.8'
services:
  web_portofolio:
    build: .
    container_name: syafiq_portofolio
    restart: always
    ports:
      - "9001:80"
    volumes:
      - .:/var/www/html
    networks:
      - default
      - mss_network

networks:
  mss_network:
    external: true
    name: mss-server-panel_mss-network
